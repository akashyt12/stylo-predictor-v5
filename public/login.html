<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Login — Stylo Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="holo-bg"><span class="nebula n1"></span><span class="nebula n2"></span><span class="nebula n3"></span></div>
<canvas id="holoCanvas"></canvas>
<div class="synth-grid"></div>

<main class="center">
  <div class="glass card-pad auth" id="card">
    <div class="brand" style="margin-bottom:22px">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 17a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-11a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></span>
      <span class="name">Stylo <span>Predictor</span></span>
    </div>
    <h2>Enter your access key</h2>
    <p class="sub">Paste the key given to you by the admin to unlock predictions.</p>

    <div id="errBox" class="err hide" style="margin-bottom:14px">
      <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2zm0 5 6.5 12h-13L12 7zm-1 4v4h2v-4h-2zm0 5v2h2v-2h-2z"/></svg>
      <span id="errMsg"></span>
    </div>

    <form id="loginForm" class="stack">
      <div class="field">
        <label>Access Key</label>
        <div class="input-icon">
          <input id="key" class="input mono" type="text" inputmode="text" autocomplete="off"
                 placeholder="WG-XXXX-XXXX-XXXX" maxlength="17" spellcheck="false" autofocus>
          <button type="button" class="eye" id="pasteBtn" title="Paste" aria-label="Paste">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
      </div>
      <button class="btn full" id="submitBtn" type="submit">Unlock</button>
    </form>

    <p class="small muted mt2" style="text-align:center">
      No key? Contact the admin. &nbsp;·&nbsp; <a href="/admin" class="muted" style="text-decoration:underline">Admin</a>
    </p>
  </div>
</main>

<script src="/assets/js/common.js"></script>
<script>
  WG.initParticles();
  var keyEl = document.getElementById('key');
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');
  var errBox = document.getElementById('errBox');
  var errMsg = document.getElementById('errMsg');

  // auto-format key as user types
  keyEl.addEventListener('input', function () {
    var raw = keyEl.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (raw.indexOf('WG') === 0) raw = raw.slice(2);
    raw = raw.slice(0, 12);
    var parts = [];
    for (var i = 0; i < raw.length; i += 4) parts.push(raw.slice(i, i + 4));
    keyEl.value = raw.length ? 'WG-' + parts.join('-') : '';
  });

  document.getElementById('pasteBtn').addEventListener('click', async function () {
    try { keyEl.value = (await navigator.clipboard.readText()).trim(); keyEl.dispatchEvent(new Event('input')); } catch (e) { keyEl.focus(); }
  });

  function showErr(m) {
    errMsg.textContent = m;
    errBox.classList.remove('hide');
    document.getElementById('card').classList.add('shake');
    setTimeout(function () { document.getElementById('card').classList.remove('shake'); }, 450);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errBox.classList.add('hide');
    var key = keyEl.value.trim().toUpperCase();
    if (!/^WG-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(key)) { showErr('Enter a valid key (WG-XXXX-XXXX-XXXX).'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Validating…';
    try {
      var res = await WG.api('/api/login', { method: 'POST', body: { key: key }, noAuth: true });
      WG.setSession(res.token, res.plan, res.planLabel, res.expires);
      WG.toast('Access granted · ' + res.planLabel, 'ok');
      setTimeout(function () { location.href = '/app'; }, 400);
    } catch (err) {
      showErr(err.error || 'Login failed');
      btn.disabled = false;
      btn.textContent = 'Unlock';
    }
  });

  // localhost-only: /login?k=WG-XXXX-XXXX-XXXX  -> auto login (dev/testing)
  (function () {
    var k = new URLSearchParams(location.search).get('k');
    if (!k) return;
    var h = location.hostname;
    if (h !== 'localhost' && h !== '127.0.0.1') return;
    WG.api('/api/login', { method: 'POST', body: { key: k }, noAuth: true }).then(function (res) {
      WG.setSession(res.token, res.plan, res.planLabel, res.expires);
      location.replace('/app');
    }).catch(function () { /* ignore */ });
  })();
</script>
</body>
</html>
